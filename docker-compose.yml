services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dastyor
      POSTGRES_USER: dastyor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgres://dastyor:${DB_PASSWORD}@db:5432/dastyor
      DEBUG: "0"
    expose:
      - "8000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [web]
    environment:
      # dastyor.uz → «dastyor.uz, www.dastyor.uz»; без домена сайт работает по IP на порту 80
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  bot:
    build: .
    restart: unless-stopped
    depends_on: [web]
    env_file: .env
    environment:
      DATABASE_URL: postgres://dastyor:${DB_PASSWORD}@db:5432/dastyor
      DEBUG: "0"
    command: python manage.py run_bot
    profiles: [bot]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
